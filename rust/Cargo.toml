[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }
module_name_repetitions = "allow"
missing_panics_doc = "allow"
missing_errors_doc = "allow"
# `ApiError` is a large enum, so every `Result<_, ApiError>` in the `api` crate
# trips `result_large_err`. The proper fix is to box `ApiError` (an invasive,
# crate-wide signature change tracked separately); allow the noisy design lint
# until that lands. Pre-existing — not introduced by the subagent work.
result_large_err = "allow"
